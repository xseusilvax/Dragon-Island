<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invasão Alienígena</title>
<style>
  :root { --bg:#dfe5f0; --edge:#9fb0d0; --glow:rgba(80,255,140,0.35); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#05060d; --edge:#1a3a2a; --glow:rgba(80,255,140,0.45); }
  }
  :root[data-theme="dark"] { --bg:#05060d; --edge:#1a3a2a; --glow:rgba(80,255,140,0.45); }
  html,body { margin:0; height:100%; }
  body { display:flex; align-items:center; justify-content:center; background:var(--bg); }
  .frame {
    width:min(94vw,1024px,calc((100dvh - 48px) * 2)); aspect-ratio:2/1; position:relative;
    border:2px solid var(--edge); border-radius:6px; overflow:hidden; background:#01020a;
    box-shadow:0 0 55px var(--glow), inset 0 0 20px rgba(150,255,200,0.15);
  }
  canvas { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<div class="frame"><canvas id="c" aria-label="Cidade sob invasão alienígena, com nave-mãe e discos voadores"></canvas></div>
<script src="engine.js"></script>
<script>
function makeHero(env) {
  const { ctx, HORIZON, TAU, rand, R, spr, glowSprite } = env;

  const MOON_X = 100, MOON_Y = 75, MOON_R = 38;
  const craters = [];
  for (let i = 0; i < 12; i++) {
    const a = rand() * TAU, d = rand() * (MOON_R - 6);
    craters.push({ x: MOON_X + Math.cos(a) * d, y: MOON_Y + Math.sin(a) * d, r: 1.2 + rand() * 4, shade: 0.1 + rand() * 0.2 });
  }

  const mothership = { x: 300, y: 60 };
  const beamParticles = [];

  const ufos = [];
  function spawnUfo(initial) {
    ufos.push({
      x: initial ? rand() * 512 : -40, y: 40 + rand() * 100,
      vx: 0.6 + rand() * 0.8, bob: rand() * TAU, bobSpeed: 0.04 + rand() * 0.04,
      hue: [140, 180, 90, 280, 320][Math.floor(rand() * 5)], size: 5 + rand() * 5,
      hasBeam: rand() > 0.6, beamPhase: rand() * TAU
    });
  }
  for (let i = 0; i < 4; i++) spawnUfo(true);

  const abductors = [
    { x: 130, y: 120, size: 7, hue: 140, phase: 0, targetY: HORIZON + 30 },
    { x: 420, y: 105, size: 6, hue: 320, phase: 1.5, targetY: HORIZON + 25 }
  ];

  function drawMoon() {
    const glow = ctx.createRadialGradient(MOON_X, MOON_Y, MOON_R * 0.5, MOON_X, MOON_Y, MOON_R * 3);
    glow.addColorStop(0, 'rgba(180,255,210,0.5)');
    glow.addColorStop(0.35, 'rgba(120,220,180,0.22)');
    glow.addColorStop(1, 'rgba(80,180,140,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(MOON_X, MOON_Y, MOON_R * 3, 0, TAU); ctx.fill();

    const moonGrad = ctx.createRadialGradient(MOON_X - MOON_R * 0.35, MOON_Y - MOON_R * 0.35, MOON_R * 0.1, MOON_X, MOON_Y, MOON_R);
    moonGrad.addColorStop(0, '#eafff0'); moonGrad.addColorStop(0.55, '#c8e8d6');
    moonGrad.addColorStop(0.9, '#88b8a0'); moonGrad.addColorStop(1, '#5a8878');
    ctx.fillStyle = moonGrad;
    ctx.beginPath(); ctx.arc(MOON_X, MOON_Y, MOON_R, 0, TAU); ctx.fill();

    for (const c of craters) {
      ctx.fillStyle = `rgba(50,90,70,${c.shade})`;
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${c.shade * 0.5})`;
      ctx.beginPath(); ctx.arc(c.x - c.r * 0.3, c.y - c.r * 0.3, c.r * 0.5, 0, TAU); ctx.fill();
    }
  }

  function drawMothership(t) {
    const mx = mothership.x, my = mothership.y + Math.sin(t * 0.02) * 3;
    const rx = 70, ry = 14;

    const glow = ctx.createRadialGradient(mx, my, 5, mx, my, rx * 1.8);
    glow.addColorStop(0, 'rgba(80,255,140,0.35)');
    glow.addColorStop(0.4, 'rgba(60,200,130,0.15)');
    glow.addColorStop(1, 'rgba(60,200,130,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(mx - rx * 2, my - rx, rx * 4, rx * 2);

    const bodyGrad = ctx.createLinearGradient(mx, my - ry, mx, my + ry);
    bodyGrad.addColorStop(0, '#3a4a44'); bodyGrad.addColorStop(0.5, '#1a2a24'); bodyGrad.addColorStop(1, '#0a1410');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath(); ctx.ellipse(mx, my, rx, ry, 0, 0, TAU); ctx.fill();

    const domeGrad = ctx.createRadialGradient(mx - rx * 0.2, my - ry, 1, mx, my - ry, rx * 0.5);
    domeGrad.addColorStop(0, 'rgba(140,220,180,0.6)'); domeGrad.addColorStop(0.5, 'rgba(60,140,110,0.35)'); domeGrad.addColorStop(1, 'rgba(20,60,40,0.1)');
    ctx.fillStyle = domeGrad;
    ctx.beginPath(); ctx.ellipse(mx, my - ry * 0.4, rx * 0.45, ry * 0.6, 0, 0, TAU); ctx.fill();

    ctx.strokeStyle = 'rgba(80,255,140,0.75)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(mx, my + ry * 0.2, rx * 0.98, ry * 0.6, 0, 0, TAU); ctx.stroke();

    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU + t * 0.02;
      const lx = mx + Math.cos(a) * rx * 0.85, ly = my + ry * 0.55 + Math.sin(a) * 2;
      const pulse = 0.5 + 0.5 * Math.sin(t * 0.1 + i * 0.7);
      const hue = (140 + i * 12 + t * 2) % 360;
      ctx.fillStyle = `hsla(${hue},90%,65%,${0.6 + pulse * 0.4})`;
      ctx.shadowColor = `hsl(${hue},90%,60%)`; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(lx, ly, 1.6 + pulse * 0.6, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0;
    }

    const beamX = mx - rx * 0.15, beamY = my + ry * 0.7, beamH = HORIZON + 50 - beamY;
    const beamPulse = 0.65 + 0.35 * Math.sin(t * 0.06);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const beamGrad = ctx.createLinearGradient(0, beamY, 0, beamY + beamH);
    beamGrad.addColorStop(0, `rgba(140,255,180,${0.35 * beamPulse})`);
    beamGrad.addColorStop(0.4, `rgba(100,230,150,${0.18 * beamPulse})`);
    beamGrad.addColorStop(1, 'rgba(60,180,120,0)');
    ctx.fillStyle = beamGrad;
    ctx.beginPath();
    ctx.moveTo(beamX - 6, beamY); ctx.lineTo(beamX + 6, beamY);
    ctx.lineTo(beamX + 22, beamY + beamH); ctx.lineTo(beamX - 22, beamY + beamH);
    ctx.closePath(); ctx.fill();

    for (let i = 0; i < 4; i++) {
      const p = ((t * 0.8 + i * 30) % beamH) / beamH;
      const cx = beamX + Math.sin(p * Math.PI * 4) * 3, cy = beamY + p * beamH;
      const cw = 6 + p * 16;
      ctx.strokeStyle = `rgba(160,255,200,${(1 - p) * 0.5 * beamPulse})`; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.ellipse(cx, cy, cw, cw * 0.3, 0, 0, TAU); ctx.stroke();
    }
    ctx.restore();

    if (Math.floor(t) % 3 === 0) {
      beamParticles.push({ x: beamX + (rand() - 0.5) * 30, y: beamY + beamH - rand() * 20, vy: -0.8 - rand() * 0.8, r: 0.8 + rand() * 1.2, life: 100, hue: 130 + rand() * 60 });
    }
  }

  function drawBeamParticles() {
    for (let i = beamParticles.length - 1; i >= 0; i--) {
      const p = beamParticles[i];
      p.y += p.vy; p.life--;
      const alpha = Math.min(1, p.life / 60);
      ctx.fillStyle = `hsla(${p.hue},100%,70%,${alpha})`;
      ctx.shadowColor = `hsl(${p.hue},100%,60%)`; ctx.shadowBlur = 4;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0;
      if (p.life <= 0 || p.y < 60) beamParticles.splice(i, 1);
    }
  }

  function drawUfos(t) {
    for (let i = ufos.length - 1; i >= 0; i--) {
      const u = ufos[i];
      u.x += u.vx; u.bob += u.bobSpeed;
      const y = u.y + Math.sin(u.bob) * 2;

      const glow = ctx.createRadialGradient(u.x, y, 1, u.x, y, u.size * 3);
      glow.addColorStop(0, `hsla(${u.hue},100%,65%,0.5)`); glow.addColorStop(1, `hsla(${u.hue},100%,65%,0)`);
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(u.x, y, u.size * 3, 0, TAU); ctx.fill();

      if (u.hasBeam) {
        const beamPulse = 0.5 + 0.5 * Math.sin(t * 0.08 + u.beamPhase);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const bg = ctx.createLinearGradient(0, y, 0, HORIZON + 30);
        bg.addColorStop(0, `hsla(${u.hue},100%,75%,${0.35 * beamPulse})`); bg.addColorStop(1, `hsla(${u.hue},100%,60%,0)`);
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.moveTo(u.x - u.size * 0.6, y + 2); ctx.lineTo(u.x + u.size * 0.6, y + 2);
        ctx.lineTo(u.x + u.size * 2.2, HORIZON + 30); ctx.lineTo(u.x - u.size * 2.2, HORIZON + 30);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }

      ctx.fillStyle = `hsla(${u.hue},40%,15%,0.95)`;
      ctx.beginPath(); ctx.ellipse(u.x, y, u.size, u.size * 0.35, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = `hsla(${u.hue},100%,65%,0.85)`; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.ellipse(u.x, y + 1, u.size * 0.95, u.size * 0.3, 0, 0, TAU); ctx.stroke();
      ctx.fillStyle = `hsla(${u.hue},100%,75%,0.6)`;
      ctx.beginPath(); ctx.ellipse(u.x, y - u.size * 0.25, u.size * 0.35, u.size * 0.28, 0, Math.PI, 0); ctx.fill();

      for (let k = 0; k < 5; k++) {
        const a = (k / 5) * TAU + t * 0.15;
        const lx = u.x + Math.cos(a) * u.size * 0.85, ly = y + Math.sin(a) * u.size * 0.28;
        const pulse = 0.4 + 0.6 * Math.abs(Math.sin(t * 0.15 + k));
        ctx.fillStyle = `hsla(${u.hue},100%,70%,${pulse})`;
        ctx.beginPath(); ctx.arc(lx, ly, 0.9, 0, TAU); ctx.fill();
      }

      if (u.x > 552) ufos.splice(i, 1);
    }
    if (Math.random() < 0.008 && ufos.length < 5) spawnUfo(false);
  }

  function drawAbductors(t) {
    for (const ab of abductors) {
      const y = ab.y + Math.sin(t * 0.03 + ab.phase) * 3;
      const glow = ctx.createRadialGradient(ab.x, y, 1, ab.x, y, ab.size * 3);
      glow.addColorStop(0, `hsla(${ab.hue},100%,65%,0.55)`); glow.addColorStop(1, `hsla(${ab.hue},100%,65%,0)`);
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(ab.x, y, ab.size * 3, 0, TAU); ctx.fill();

      const beamPulse = 0.6 + 0.4 * Math.sin(t * 0.09 + ab.phase);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const bg = ctx.createLinearGradient(0, y, 0, ab.targetY);
      bg.addColorStop(0, `hsla(${ab.hue},100%,75%,${0.4 * beamPulse})`);
      bg.addColorStop(0.6, `hsla(${ab.hue},100%,65%,${0.18 * beamPulse})`);
      bg.addColorStop(1, `hsla(${ab.hue},100%,60%,0)`);
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.moveTo(ab.x - ab.size * 0.5, y + 2); ctx.lineTo(ab.x + ab.size * 0.5, y + 2);
      ctx.lineTo(ab.x + ab.size * 2.4, ab.targetY); ctx.lineTo(ab.x - ab.size * 2.4, ab.targetY);
      ctx.closePath(); ctx.fill();

      const bh = ab.targetY - y;
      for (let i = 0; i < 3; i++) {
        const p = ((t * 1.2 + i * 40) % bh) / bh;
        const cy = ab.targetY - p * bh, cw = ab.size * 2.4 - p * (ab.size * 1.9);
        ctx.strokeStyle = `hsla(${ab.hue},100%,75%,${(1 - p) * 0.5 * beamPulse})`; ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.ellipse(ab.x, cy, cw, cw * 0.25, 0, 0, TAU); ctx.stroke();
      }
      ctx.restore();

      ctx.fillStyle = `hsla(${ab.hue},40%,15%,0.95)`;
      ctx.beginPath(); ctx.ellipse(ab.x, y, ab.size, ab.size * 0.35, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = `hsla(${ab.hue},100%,65%,0.9)`; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.ellipse(ab.x, y + 1, ab.size * 0.95, ab.size * 0.3, 0, 0, TAU); ctx.stroke();
      ctx.fillStyle = `hsla(${ab.hue},100%,75%,0.7)`;
      ctx.beginPath(); ctx.ellipse(ab.x, y - ab.size * 0.25, ab.size * 0.35, ab.size * 0.28, 0, Math.PI, 0); ctx.fill();

      for (let k = 0; k < 5; k++) {
        const a = (k / 5) * TAU + t * 0.2 + ab.phase;
        const lx = ab.x + Math.cos(a) * ab.size * 0.85, ly = y + Math.sin(a) * ab.size * 0.28;
        const pulse = 0.4 + 0.6 * Math.abs(Math.sin(t * 0.2 + k + ab.phase));
        ctx.fillStyle = `hsla(${ab.hue},100%,70%,${pulse})`;
        ctx.beginPath(); ctx.arc(lx, ly, 1, 0, TAU); ctx.fill();
      }
    }
  }

  return {
    behind(dt, t) {
      drawMoon();
      drawMothership(t);
      drawBeamParticles();
      drawUfos(t);
      drawAbductors(t);
    }
  };
}

SceneEngine.start({
  seed: 140277,
  windowHues: [140, 170, 90],
  neonHues: [140, 90, 320],
  backColor: '#0a1a14',
  frontColor: '#020806',
  backFog: 'rgba(40,140,90,A)',
  frontFog: 'rgba(20,80,50,A)',
  rimColor: 'rgba(80,255,140,0.55)',
  groundNear: '#04140e',
  gridColor: 'rgb(80,255,140)',
  cloudRgb: '120,255,180',
  dustHue: 140,
  groundReflection: () => ({ x: 300, y: 0, r: 110, color: 'rgba(120,255,180,0.35)' }),
  paintSky(g, W, H, HORIZON) {
    const sky = g.createLinearGradient(0, 0, 0, HORIZON);
    sky.addColorStop(0, '#01030a'); sky.addColorStop(0.4, '#05162a');
    sky.addColorStop(0.75, '#0a2a35'); sky.addColorStop(1, '#0f3a30');
    g.fillStyle = sky; g.fillRect(0, 0, W, HORIZON);
    const haze = g.createLinearGradient(0, HORIZON - 60, 0, HORIZON);
    haze.addColorStop(0, 'rgba(60,200,130,0)'); haze.addColorStop(1, 'rgba(60,200,130,0.18)');
    g.fillStyle = haze; g.fillRect(0, HORIZON - 60, W, 60);
  },
  makeHero
});
</script>
</body>
</html>
