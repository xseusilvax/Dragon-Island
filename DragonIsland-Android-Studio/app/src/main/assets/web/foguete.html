<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foguete Cortando o Céu</title>
<style>
  :root { --bg:#dfe5f0; --edge:#9fb0d0; --glow:rgba(255,140,60,0.35); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#05060d; --edge:#2a1a3a; --glow:rgba(255,140,60,0.5); }
  }
  :root[data-theme="dark"] { --bg:#05060d; --edge:#2a1a3a; --glow:rgba(255,140,60,0.5); }
  html,body { margin:0; height:100%; }
  body { display:flex; align-items:center; justify-content:center; background:var(--bg); }
  .frame {
    width:min(94vw,1024px,calc((100dvh - 48px) * 2)); aspect-ratio:2/1; position:relative;
    border:2px solid var(--edge); border-radius:6px; overflow:hidden; background:#01020a;
    box-shadow:0 0 55px var(--glow), inset 0 0 20px rgba(255,200,120,0.15);
  }
  canvas { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<div class="frame"><canvas id="c" aria-label="Foguete cruzando o céu noturno com rastro de fogo"></canvas></div>
<script src="engine.js"></script>
<script>
function makeHero(env) {
  const { ctx, W, HORIZON, TAU, rand } = env;

  const rocket = {
    progress: 0, duration: 900, x: 0, y: 0, angle: 0, exhaustFlicker: 0,
    trailPoints: [], maxTrail: 120,
    tStart: { x: -60, y: HORIZON + 40 }, tEnd: { x: W + 60, y: 20 }
  };
  const smokeClouds = [];

  function update(t) {
    rocket.progress += 1 / rocket.duration;
    const p = rocket.progress;
    const eased = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    rocket.x = rocket.tStart.x + (rocket.tEnd.x - rocket.tStart.x) * eased;
    rocket.y = rocket.tStart.y + (rocket.tEnd.y - rocket.tStart.y) * Math.pow(eased, 0.85);
    const dx = rocket.tEnd.x - rocket.tStart.x, dy = rocket.tEnd.y - rocket.tStart.y;
    rocket.angle = Math.atan2(dy, dx);
    rocket.exhaustFlicker = 0.7 + 0.3 * Math.sin(t * 0.5) + 0.15 * rand();

    rocket.trailPoints.push({ x: rocket.x, y: rocket.y, life: 1 });
    if (rocket.trailPoints.length > rocket.maxTrail) rocket.trailPoints.shift();
    for (const tp of rocket.trailPoints) { tp.life -= 0.008; if (tp.life < 0) tp.life = 0; }

    if (Math.floor(t) % 2 === 0) {
      const backAngle = rocket.angle + Math.PI;
      smokeClouds.push({
        x: rocket.x + Math.cos(backAngle) * 6 + (rand() - 0.5) * 3,
        y: rocket.y + Math.sin(backAngle) * 6 + (rand() - 0.5) * 3,
        r: 3 + rand() * 3, life: 1, decay: 0.004 + rand() * 0.004,
        vx: (rand() - 0.5) * 0.2, vy: (rand() - 0.5) * 0.2
      });
    }
    if (rocket.progress > 1.15) { rocket.progress = 0; rocket.trailPoints = []; }
  }

  function drawSmoke() {
    for (let i = smokeClouds.length - 1; i >= 0; i--) {
      const s = smokeClouds[i];
      s.x += s.vx; s.y += s.vy; s.life -= s.decay; s.r += 0.05;
      if (s.life <= 0) { smokeClouds.splice(i, 1); continue; }
      const alpha = s.life * 0.55;
      if (s.life > 0.75) {
        const hotAlpha = (s.life - 0.75) * 4 * 0.6;
        const hotGrad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
        hotGrad.addColorStop(0, `rgba(255,220,140,${hotAlpha})`);
        hotGrad.addColorStop(0.5, `rgba(255,150,60,${hotAlpha * 0.5})`);
        hotGrad.addColorStop(1, 'rgba(255,100,40,0)');
        ctx.fillStyle = hotGrad;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
      }
      const grad = ctx.createRadialGradient(s.x - s.r * 0.3, s.y - s.r * 0.3, 0, s.x, s.y, s.r);
      grad.addColorStop(0, `rgba(200,200,210,${alpha * 0.9})`);
      grad.addColorStop(0.6, `rgba(150,150,165,${alpha * 0.6})`);
      grad.addColorStop(1, 'rgba(80,80,100,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    }
  }

  function drawTrail() {
    if (rocket.trailPoints.length < 2) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 1; i < rocket.trailPoints.length; i++) {
      const a = rocket.trailPoints[i - 1], b = rocket.trailPoints[i];
      const g1 = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      g1.addColorStop(0, `rgba(255,140,60,${a.life * 0.4})`); g1.addColorStop(1, `rgba(255,140,60,${b.life * 0.4})`);
      ctx.strokeStyle = g1; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      const g2 = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      g2.addColorStop(0, `rgba(255,240,180,${a.life * 0.9})`); g2.addColorStop(1, `rgba(255,240,180,${b.life * 0.9})`);
      ctx.strokeStyle = g2; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${Math.min(a.life, b.life) * 0.85})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawRocket() {
    const x = rocket.x, y = rocket.y, ang = rocket.angle;
    const flameLen = 14 + rocket.exhaustFlicker * 8, flameW = 3 + rocket.exhaustFlicker * 1.5;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(x, y); ctx.rotate(ang);
    const flameGrad = ctx.createLinearGradient(-6, 0, -flameLen, 0);
    flameGrad.addColorStop(0, 'rgba(255,220,140,0.95)'); flameGrad.addColorStop(0.3, 'rgba(255,160,60,0.85)');
    flameGrad.addColorStop(0.7, 'rgba(255,90,30,0.45)'); flameGrad.addColorStop(1, 'rgba(255,50,0,0)');
    ctx.fillStyle = flameGrad;
    ctx.beginPath();
    ctx.moveTo(-6, -flameW); ctx.quadraticCurveTo(-flameLen * 0.6, -flameW * 0.7, -flameLen, 0);
    ctx.quadraticCurveTo(-flameLen * 0.6, flameW * 0.7, -6, flameW); ctx.closePath(); ctx.fill();
    const innerGrad = ctx.createLinearGradient(-4, 0, -flameLen * 0.7, 0);
    innerGrad.addColorStop(0, 'rgba(255,255,240,1)'); innerGrad.addColorStop(0.5, 'rgba(255,230,130,0.85)'); innerGrad.addColorStop(1, 'rgba(255,180,60,0)');
    ctx.fillStyle = innerGrad;
    ctx.beginPath();
    ctx.moveTo(-4, -flameW * 0.55); ctx.quadraticCurveTo(-flameLen * 0.5, -flameW * 0.3, -flameLen * 0.7, 0);
    ctx.quadraticCurveTo(-flameLen * 0.5, flameW * 0.3, -4, flameW * 0.55); ctx.closePath(); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(x, y); ctx.rotate(ang);
    ctx.shadowColor = 'rgba(255,200,130,0.75)'; ctx.shadowBlur = 10;
    const bodyGrad = ctx.createLinearGradient(0, -2.2, 0, 2.2);
    bodyGrad.addColorStop(0, '#f0f2f8'); bodyGrad.addColorStop(0.45, '#c8ccd8');
    bodyGrad.addColorStop(0.55, '#8a90a0'); bodyGrad.addColorStop(1, '#4a4e5c');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(-7, -2.2); ctx.lineTo(6, -2.2); ctx.lineTo(9, 0); ctx.lineTo(6, 2.2); ctx.lineTo(-7, 2.2);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(220,60,60,0.9)';
    ctx.fillRect(-6, -1, 3, 2); ctx.fillRect(1, -1, 3, 2);

    const noseGrad = ctx.createLinearGradient(6, -2.2, 9, 0);
    noseGrad.addColorStop(0, '#ff8855'); noseGrad.addColorStop(0.6, '#cc3a20'); noseGrad.addColorStop(1, '#6a1808');
    ctx.fillStyle = noseGrad;
    ctx.beginPath(); ctx.moveTo(6, -2.2); ctx.lineTo(9, 0); ctx.lineTo(6, 2.2); ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#b0b4c0';
    ctx.beginPath(); ctx.moveTo(-7, -2.2); ctx.lineTo(-9, -5.5); ctx.lineTo(-5, -2.2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-7, 2.2); ctx.lineTo(-9, 5.5); ctx.lineTo(-5, 2.2); ctx.closePath(); ctx.fill();

    const winGrad = ctx.createRadialGradient(2, -0.5, 0.2, 2, 0, 1.5);
    winGrad.addColorStop(0, 'rgba(180,240,255,1)'); winGrad.addColorStop(0.6, 'rgba(80,180,240,0.9)'); winGrad.addColorStop(1, 'rgba(30,80,140,0.9)');
    ctx.fillStyle = winGrad;
    ctx.beginPath(); ctx.arc(2, 0, 1.5, 0, TAU); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.moveTo(-6, -2.2); ctx.lineTo(5, -2.2); ctx.lineTo(5, -1.6); ctx.lineTo(-6, -1.6); ctx.closePath(); ctx.fill();
    ctx.restore();

    const aura = ctx.createRadialGradient(x, y, 2, x, y, 22);
    aura.addColorStop(0, `rgba(255,210,150,${0.35 * rocket.exhaustFlicker})`); aura.addColorStop(1, 'rgba(255,150,60,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(x, y, 22, 0, TAU); ctx.fill();
    ctx.restore();
  }

  return {
    behind(dt, t) {
      update(t);
      drawTrail();
      drawSmoke();
      drawRocket();
    }
  };
}

SceneEngine.start({
  seed: 998877,
  windowHues: [35, 200, 220],
  neonHues: [35, 200],
  backColor: '#0a1224',
  frontColor: '#030711',
  backFog: 'rgba(40,80,140,A)',
  frontFog: 'rgba(20,40,80,A)',
  rimColor: 'rgba(140,200,255,0.7)',
  groundNear: '#081226',
  gridColor: 'rgb(120,190,255)',
  cloudRgb: '180,210,255',
  dustHue: 30,
  groundReflection: () => ({ x: 380, y: 0, r: 130, color: 'rgba(140,200,255,0.28)' }),
  paintSky(g, W, H, HORIZON) {
    const sky = g.createLinearGradient(0, 0, 0, HORIZON);
    sky.addColorStop(0, '#01020a'); sky.addColorStop(0.45, '#071233');
    sky.addColorStop(0.8, '#122a55'); sky.addColorStop(1, '#2a4a7a');
    g.fillStyle = sky; g.fillRect(0, 0, W, HORIZON);
  },
  makeHero
});
</script>
</body>
</html>
