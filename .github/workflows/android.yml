name: Build

on:
  push:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    defaults:
      run:
        working-directory: DragonIsland-Android-Studio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3
        with:
          gradle-wrapper-directory: DragonIsland-Android-Studio/gradle/wrapper

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble debug APK
        run: ./gradlew --no-configuration-cache assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dragon-island-debug-apk
          path: DragonIsland-Android-Studio/app/build/outputs/apk/debug/*.apk
          retention-days: 14
